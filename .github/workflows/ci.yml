name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    # Run the daemon/CLI/GPU-OC python tests and the backend node tests.
    # Source-only CI: no RPM build here — the packaged payload needs
    # src/psense-electron/app/, which is deliberately not in the repo
    # (see README §Source-only distribution policy).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: python tests (daemon, cli lighting, gpu-oc)
        run: |
          python3 -m unittest tests.test_cli_lighting \
                              tests.test_lighting_engine \
                              tests.test_gpu_oc
      - name: syntax-check electron shims
        run: |
          node --check src/psense-electron/backend.js
          node --check src/psense-electron/main.js
          node --check src/psense-electron/lighting-engine.js
      - name: syntax-check installer scripts
        run: |
          bash -n setup.sh
          bash -n packaging/install.sh
          bash -n src/psense-wmi/install-dkms.sh
      - name: backend(node) tests
        run: node --test tests/test_backend_lighting.js
  rust:
    # psensed-rs workspace: byte-contract tests + strict lint gate. Separate
    # job so a toolchain hiccup never blocks the python/node lanes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo test (byte-locked frame + effect table parity)
        working-directory: src/psensed-rs
        run: cargo test --workspace
      - name: cargo clippy (-D warnings)
        working-directory: src/psensed-rs
        run: cargo clippy --workspace -- -D warnings
